<!doctype html>
<html lang="de">
<head><meta charset="utf-8"><link rel="stylesheet" href="brand.css"></head>
<body data-format="story">
<!--
    Story-Rahmen fuer einen Umfrage- oder Frage-Sticker.

    Die Flaeche zwischen Headline und Schlusszeile bleibt absichtlich leer
    (.sticker-zone) — dort wird beim Posten der Instagram-Sticker platziert.
    Sie darf NICHT mit Inhalt gefuellt werden, sonst ueberdeckt der Sticker ihn.

    Zweck: Antworten auf diese Frage liefern die Zahlen, die der Aussen-
    kommunikation bisher fehlen. Solange nichts gemessen ist, darf auf
    Landingpage und Grafiken keine Zeitersparnis behauptet werden
    (siehe internal/marketing/captions.md).
-->
<div class="slide">

    <div class="brandbar">
        <div class="lockup">
            <img src="../public/koreki-icon-transparent.png" alt="">
            <div class="wordmark">Koreki<span>.</span></div>
        </div>
        <div class="handle">koreki.org</div>
    </div>

    <div class="h44"></div>

    <div class="eyebrow">Ehrliche Frage</div>
    <div class="h20"></div>
    <h1 class="s">Wie lange<br>brauchst du für<br><span class="grad">einen Klassensatz?</span></h1>

    <div class="h44"></div>

    <!-- Sticker kommt hierhin — Flaeche freihalten -->
    <div class="sticker-zone"></div>

    <div class="spacer"></div>

    <p class="lead sm"><b>Wir sammeln Zahlen, bevor wir welche behaupten.</b><br>
        Deine Antwort hilft uns dabei.</p>

</div>
</body>
</html>
