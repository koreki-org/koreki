<!doctype html>
<html lang="de">
<head><meta charset="utf-8"><link rel="stylesheet" href="brand.css"></head>
<body data-format="story">
<!--
    Story-Vorlage (1080x1920).
    Das Padding in brand.css haelt oben ~270px und unten ~350px frei — dort
    liegen Profilzeile, Antwortfeld und Link-Sticker von Instagram. Nichts
    Wichtiges dort platzieren.
-->
<div class="slide">

    <div class="brandbar">
        <div class="lockup">
            <img src="../public/koreki-icon-transparent.png" alt="">
            <div class="wordmark">Koreki<span>.</span></div>
        </div>
        <div class="handle">koreki.org</div>
    </div>

    <div class="spacer"></div>

    <div class="eyebrow">Neu in Koreki</div>
    <div class="h20"></div>
    <h1>Korrigieren,<br>ohne die<br><span class="grad">Kontrolle<br>abzugeben.</span></h1>
    <div class="h44"></div>
    <p class="lead">Punkte je Kriterium, ein KI-Vertrauen pro Aufgabe —
        und du entscheidest, was zählt.</p>

    <div class="h60"></div>

    <div class="stats">
        <div class="stat">
            <div class="val">3</div>
            <div class="lbl">Editionen: Desktop, Self-Hosted, Cloud</div>
        </div>
        <div class="stat">
            <div class="val" style="color:var(--emerald)">0</div>
            <div class="lbl">Telemetrie in der Community Edition</div>
        </div>
    </div>

    <div class="spacer"></div>

    <div class="swipe">Link in Bio <span class="arrow">↑</span></div>

</div>
</body>
</html>
