<!doctype html>
<html lang="de">
<head><meta charset="utf-8"><link rel="stylesheet" href="brand.css"></head>
<body data-format="linkedin-cover">
<!--
    Kopfbild der LinkedIn-Unternehmensseite (1584x396).

    Die oft zitierten 1128x191 nimmt LinkedIns Zuschneide-Dialog nicht mehr an
    — er zeigt das Bild dann mit schwarzen Balken. 1584x396 liegt darueber und
    laesst LinkedIn Spielraum beim Beschneiden; der Inhalt sitzt deshalb
    vertikal mittig und vertraegt Beschnitt oben wie unten.

    Die linken ~420px (rund ein Viertel) bleiben frei, dort liegt das
    Seitenlogo darueber. Auf Mobilgeraeten beschneidet LinkedIn zusaetzlich
    an den Raendern — nichts Wichtiges nach ganz aussen.

    Das Koreki-Symbol fehlt hier bewusst: Es kommt aus dem Logo-Feld der
    Seite (public/koreki-avatar-social.png) und wuerde sonst doppelt stehen.
    Der Freiraum links ist deshalb kein Layoutfehler, auch wenn LinkedIn das
    Logo auf manchen mobilen Ansichten unter das Titelbild setzt statt darauf.
-->
<div class="slide">

    <div>
        <div class="cover-claim">Dein KI-Korrektur Assistent</div>
        <div class="cover-sub">Kriterienweise Bewertung · Desktop, Self-Hosted oder Cloud ·
            Lokale KI möglich · <b>koreki.org</b></div>
    </div>

</div>
</body>
</html>
