events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile        on;
    keepalive_timeout  65;

    # Bilder gehen als Base64 im JSON-Rumpf an /api/extract-image, das dort
    # ausdruecklich 50 MB erlaubt (`bodyParser.sizeLimit` in der Route).
    # Ohne diese Zeile gilt nginx' Standard von 1 MB — und der Gateway
    # beantwortet jeden Bildupload mit einer 413-HTML-Seite, BEVOR die Anfrage
    # Next.js erreicht. Im Browser kam das als
    # "Unexpected token '<', "<html>..." is not valid JSON" an, weil der Client
    # eine JSON-Antwort erwartet. Betroffen war nur der Weg ueber diesen
    # Gateway, also Community Multi-User (09.09.2026).
    #
    # Der Wert gehoert zu `sizeLimit` in src/pages/api/extract-image.ts.
    client_max_body_size 50m;

    # Gzip Compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # Map upstream/client scheme to preserve original protocol (e.g. behind HAProxy/OPNsense)
    map $http_x_forwarded_proto $real_scheme {
        default $http_x_forwarded_proto;
        ''      $scheme;
    }

    server {
        listen 80;
        server_name localhost;

        # Security Headers
        add_header X-Frame-Options "SAMEORIGIN";
        add_header X-XSS-Protection "1; mode=block";
        add_header X-Content-Type-Options "nosniff";

        # Keycloak Auth Path
        location /auth {
            proxy_pass http://keycloak:8080;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $real_scheme;
            proxy_set_header X-Forwarded-Host $http_host;
            
            # Keycloak specific settings
            proxy_buffer_size          128k;
            proxy_buffers              4 256k;
            proxy_busy_buffers_size    256k;
        }

        # Koreki App (Default)
        location / {
            resolver 127.0.0.11 valid=30s ipv6=off;
            set $koreki_target "http://koreki:3000";
            proxy_pass $koreki_target;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $real_scheme;
            proxy_set_header X-Forwarded-Host $http_host;

            # AI Generation Timeouts (10 Minutes)
            proxy_read_timeout 600s;
            proxy_connect_timeout 600s;
            proxy_send_timeout 600s;

            # WebSockets for Next.js HMR (if used)
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }
    }
}
