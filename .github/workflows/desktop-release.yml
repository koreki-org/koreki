name: Koreki Desktop Release

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  # Den Entwurf EINMAL anlegen, bevor gebaut wird. Bis 10.11.2026 legte ihn
  # der Build an, der zuerst fertig war — bei v0.9.100 waren Windows und Linux
  # fast gleichzeitig fertig, beide wollten anlegen, Linux scheiterte und
  # musste komplett neu gebaut werden.
  entwurf:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      id: ${{ steps.anlegen.outputs.id }}
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      REPO: ${{ github.repository }}
      TAG: ${{ github.ref_name }}
    steps:
      - name: Entwurf anlegen (falls noch nicht da)
        id: anlegen
        run: |
          # Entwurf + Pre-Release: Veroeffentlicht wird erst nach Freigabe der
          # Release Notes (Skill `release`). Bis auf Widerruf nur Pre-Releases;
          # tests/unit/release-governance.test.ts haelt beides fest.
          if ! gh release view "$TAG" --repo "$REPO" >/dev/null 2>&1; then
            gh release create "$TAG" --repo "$REPO" --draft --prerelease \
              --title "Koreki $TAG" --notes "Entwurf — die Release Notes folgen nach der Freigabe."
          fi
          id=$(gh api "repos/$REPO/releases" --paginate --jq ".[] | select(.tag_name == \"$TAG\") | .id" | head -1)
          test -n "$id"
          echo "id=$id" >> "$GITHUB_OUTPUT"

  publish:
    needs: entwurf
    permissions:
      contents: write
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'windows-latest'
            args: ''
          - platform: 'ubuntu-latest' # For Linux (Debian/Ubuntu)
            args: ''

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Node
        uses: actions/setup-node@1d0ff469b7ec7b3cb9d8673fde0c81c44821de2a # v4.2.0
        with:
          node-version: 24
          cache: npm

      - name: Install Rust Stable
        uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: stable
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      # Bereits kompilierte Rust-Bibliotheken wiederverwenden. Ohne Cache
      # uebersetzte jeder Build alle ~400 Abhaengigkeiten neu (7–8 Minuten).
      - name: Rust-Cache
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: src-tauri -> target

      - name: Install Linux Dependencies (Ubuntu only)
        if: matrix.platform == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Install Dependencies
        run: npm install --legacy-peer-deps

      - name: Build Frontend & Desktop App
        uses: tauri-apps/tauri-action@84b9d35b5fc46c1e45415bdb6144030364f7ebc5 # v0.6.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Signiert die Pakete fuer die Selbst-Aktualisierung. Ohne gueltige
          # Signatur verweigert die installierte App das Update.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # Force Desktop Mode for static export
          NEXT_PUBLIC_KOREKI_MODE: desktop
          NEXT_PUBLIC_KOREKI_DESKTOP: "true"
        with:
          # In den vorab angelegten Entwurf hochladen (Job `entwurf`).
          releaseId: ${{ needs.entwurf.outputs.id }}
          # Update-Pakete + Signaturen nur im Release-Build. Lokal (`npm run
          # build:desktop`) gibt es keinen privaten Schluessel; mit dem Schalter
          # in tauri.conf.json wuerde dort jeder Build abbrechen. tauri-action
          # legt aus den Signaturen die latest.json an, die die App abfragt.
          args: --config src-tauri/tauri.release.conf.json ${{ matrix.args }}

  # Beide Builds ergaenzen dieselbe latest.json. Sind sie gleichzeitig fertig,
  # kann der zweite den Eintrag des ersten ueberschreiben — dann fehlt eine
  # Plattform, und deren Apps bekaemen nie ein Update. Ein fehlender Eintrag
  # faellt sonst niemandem auf; deshalb schlaegt dieser Job dann laut fehl.
  pruefen:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write # Entwuerfe sind nur mit Schreibrecht sichtbar
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      REPO: ${{ github.repository }}
      TAG: ${{ github.ref_name }}
    steps:
      - name: latest.json vollstaendig?
        run: |
          gh release download "$TAG" --repo "$REPO" --pattern latest.json --dir pruefung
          for plattform in windows-x86_64 linux-x86_64; do
            if ! jq -e --arg p "$plattform" '.platforms[$p].signature | length > 0' pruefung/latest.json >/dev/null; then
              echo "::error::latest.json ohne $plattform — Build dieser Plattform neu starten, NICHT veroeffentlichen."
              exit 1
            fi
          done
          echo "latest.json enthaelt Windows und Linux."
