name: Koreki Community Release (Docker)

# Gebaut wird erst, wenn ein Release veroeffentlicht ist — nicht schon beim
# Tag. So gilt fuer das Image dieselbe Freigabe wie fuer die Desktop-App
# (Skill `release`, Waechter tests/unit/release-governance.test.ts).
on:
  workflow_dispatch:
  release:
    types: [published]

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      DATABASE_URL: "postgresql://dummy:dummy@localhost:5432/dummy"

    steps:
      - name: Checkout Repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@b5ca514318bd6ebac0fb2aedd5d36ec1b5c232a2 # v3.10.0

      - name: Login to GitHub Container Registry
        uses: docker/login-action@9780b0c442fbb1117ed29e0efdff1e18412f7567 # v3.3.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@8e5442c4ef9f78752691e2d8f8d19755c6f78e81 # v5.5.1
        with:
          images: ghcr.io/${{ github.repository }}
          # `latest` nur fuer echte Releases. Solange Koreki nur Pre-Releases
          # veroeffentlicht, bekommt das Image nur seine Versionsnummer.
          flavor: |
            latest=false
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest,enable=${{ github.event_name == 'release' && !github.event.release.prerelease }}

      - name: Build and Push Community Edition
        uses: docker/build-push-action@4a13e500e55cf31b7a5d59a38ab2040ab0f42f56 # v5.1.0
        with:
          context: .
          push: true
          # FORCE COMMUNITY MODE FOR PUBLIC RELEASE
          build-args: |
            NEXT_PUBLIC_KOREKI_MODE=community
            NEXT_PUBLIC_SINGLE_USER_MODE=false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
